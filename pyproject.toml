[project]
name = "flavorgraph-ai"
version = "1.0.0"
description = "Explainable recipe recommendations using a culinary knowledge graph"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "networkx>=3.4,<4", "gunicorn>=23,<24"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
